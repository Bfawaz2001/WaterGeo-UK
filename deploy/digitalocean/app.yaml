name: watergeo-preview
region: lon

vpc:
  id: __VPC_ID__

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: edge

maintenance:
  enabled: __MAINTENANCE_ENABLED__

databases:
  - name: watergeo-db
    engine: PG
    production: true
    cluster_name: __DATABASE_CLUSTER_NAME__

services:
  - name: edge
    image:
      registry_type: GHCR
      registry: bfawaz2001
      repository: watergeo-uk-web
      digest: __WEB_IMAGE_DIGEST__
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    envs:
      - key: WATERGEO_PUBLIC_HOSTS
        scope: RUN_TIME
        value: '${APP_DOMAIN}'
    health_check:
      port: 8080
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    liveness_health_check:
      port: 8080
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
  - name: api
    image:
      registry_type: GHCR
      registry: bfawaz2001
      repository: watergeo-uk
      digest: __API_IMAGE_DIGEST__
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    internal_ports:
      - 8000
    run_command: >-
      watergeo-with-db-ca uvicorn watergeo.api.app:create_app --factory
      --host 0.0.0.0 --port 8000 --no-access-log --no-proxy-headers
    envs:
      - key: WATERGEO_SERVICE_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: WATERGEO_TRUSTED_HOSTS
        scope: RUN_TIME
        value: '["${APP_DOMAIN}","health.internal"]'
      - key: WATERGEO_DB_HOST
        scope: RUN_TIME
        value: __DATABASE_PRIVATE_HOST__
      - key: WATERGEO_DB_PORT
        scope: RUN_TIME
        value: '${watergeo-db.PORT}'
      - key: WATERGEO_DB_NAME
        scope: RUN_TIME
        value: watergeo
      - key: WATERGEO_DB_USER
        scope: RUN_TIME
        value: watergeo_app
      - key: WATERGEO_DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: __APP_DATABASE_PASSWORD__
      - key: WATERGEO_DB_SSLMODE
        scope: RUN_TIME
        value: verify-full
      - key: WATERGEO_DB_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: '${watergeo-db.CA_CERT}'
    health_check:
      port: 8000
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    liveness_health_check:
      port: 8000
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: bfawaz2001
      repository: watergeo-uk
      digest: __API_IMAGE_DIGEST__
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: watergeo-with-db-ca alembic upgrade head
    envs:
      - key: WATERGEO_SERVICE_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: WATERGEO_DB_HOST
        scope: RUN_TIME
        value: __DATABASE_PRIVATE_HOST__
      - key: WATERGEO_DB_PORT
        scope: RUN_TIME
        value: '${watergeo-db.PORT}'
      - key: WATERGEO_DB_NAME
        scope: RUN_TIME
        value: watergeo
      - key: WATERGEO_MIGRATION_USER
        scope: RUN_TIME
        value: watergeo_migrator
      - key: WATERGEO_MIGRATION_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: __MIGRATION_DATABASE_PASSWORD__
      - key: WATERGEO_DB_SSLMODE
        scope: RUN_TIME
        value: verify-full
      - key: WATERGEO_DB_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: '${watergeo-db.CA_CERT}'
# __BOOTSTRAP_JOB__
