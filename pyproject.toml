[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "watergeo-uk"
version = "0.1.0"
description = "An independent, open-source geospatial interface for public UK water data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Bilal Fawaz" }]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyproj>=3.8,<4",
    "pyshp>=3.1,<4",
    "shapely>=2.1,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
watergeo = "watergeo.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watergeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --tb=short -ra"
markers = ["integration: requires an explicitly enabled disposable PostgreSQL/PostGIS database"]
filterwarnings = [
    "error",
    # Starlette 1.6 uses an AnyIO alias internally; remove when Starlette updates it.
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["shapefile", "shapely.*"]
ignore_missing_imports = true
