name: Publish governed static beta to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'Bfawaz2001/WaterGeo-UK' &&
      github.ref == 'refs/heads/main' &&
      vars.WATERGEO_STATIC_EVIDENCE_RELEASE_ID != '' &&
      vars.WATERGEO_STATIC_EVIDENCE_SHA256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    environment: static-preview-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: uv sync --locked --extra exports
      - name: Generate disposable database credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a") as destination:
              for key in ("POSTGRES_PASSWORD", "WATERGEO_DB_PASSWORD", "WATERGEO_MIGRATION_PASSWORD", "WATERGEO_INGESTION_PASSWORD"):
                  value = secrets.token_hex(24)
                  print(f"::add-mask::{value}")
                  destination.write(f"{key}={value}\n")
          PY
      - run: docker compose up --build --wait db
      - name: Apply schema migrations
        run: uv run --locked alembic upgrade head
      - name: Download checksum-pinned reviewed evidence release asset
        env:
          GH_TOKEN: ${{ secrets.WATERGEO_STATIC_EVIDENCE_TOKEN }}
          EVIDENCE_RELEASE_ID: ${{ vars.WATERGEO_STATIC_EVIDENCE_RELEASE_ID }}
          EVIDENCE_SHA256: ${{ vars.WATERGEO_STATIC_EVIDENCE_SHA256 }}
        run: |
          : "${GH_TOKEN:?WATERGEO_STATIC_EVIDENCE_TOKEN is required}"
          if ! [[ "$EVIDENCE_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "WATERGEO_STATIC_EVIDENCE_RELEASE_ID must be a numeric release ID" >&2
            exit 1
          fi
          if ! [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "WATERGEO_STATIC_EVIDENCE_SHA256 must be a lowercase SHA-256" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/evidence-download"
          gh api "repos/$GITHUB_REPOSITORY/releases/$EVIDENCE_RELEASE_ID" > "$RUNNER_TEMP/evidence-download/release.json"
          asset_id="$(python - "$RUNNER_TEMP/evidence-download/release.json" <<'PY'
          import json
          import os
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          assets = [asset for asset in release.get("assets", []) if asset.get("name") == "accepted-evidence.tar.gz"]
          expected = os.environ["EVIDENCE_SHA256"]
          if release.get("draft") is not True or str(release.get("id")) != os.environ["EVIDENCE_RELEASE_ID"]:
              raise SystemExit("Configured evidence release is not the exact reviewed draft")
          if len(assets) != 1 or assets[0].get("state") != "uploaded" or assets[0].get("size", 0) > 1073741824:
              raise SystemExit("Draft release must contain one bounded uploaded accepted-evidence.tar.gz")
          if assets[0].get("digest") not in (None, f"sha256:{expected}"):
              raise SystemExit("Release asset digest does not match the configured checksum")
          print(assets[0]["id"])
          PY
          )"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/evidence-download/accepted-evidence.tar.gz"
          printf '%s  %s\n' "$EVIDENCE_SHA256" "$RUNNER_TEMP/evidence-download/accepted-evidence.tar.gz" | sha256sum --check --strict
          uv run --locked python scripts/extract_static_evidence.py "$RUNNER_TEMP/evidence-download/accepted-evidence.tar.gz" "$RUNNER_TEMP/accepted-evidence"
      - name: Replay accepted source products
        run: uv run --locked python scripts/replay_static_sources.py "$RUNNER_TEMP/accepted-evidence/replay.json"
      - run: docker compose --profile app up --build --wait api
      - name: Build immutable data publication
        run: uv run --locked watergeo-static-publish --output "$RUNNER_TEMP/watergeo-data" --analytics
      - name: Install and test explorer
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
      - name: Build and accept Pages site
        working-directory: web
        env:
          VITE_BASE_PATH: /WaterGeo-UK/
          VITE_WATERGEO_DATA_MODE: static
          VITE_BASEMAP_STYLE_URL: ""
        run: |
          mkdir -p public/watergeo-data
          cp -R "$RUNNER_TEMP/watergeo-data/." public/watergeo-data/
          npm run build
          npm run test:e2e:static
          cp dist/index.html dist/404.html
      - name: Validate public artifact
        run: |
          test -f web/dist/index.html
          test -f web/dist/404.html
          test -f web/dist/watergeo-data/manifest.json
          test -f web/dist/watergeo-data/publication-report.json
          uv run --locked python -m json.tool web/dist/watergeo-data/publication-report.json >/dev/null
          uv run --locked python -m watergeo.operations.public_artifact web/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
      - name: Remove disposable database
        if: always()
        run: docker compose --profile app down --volumes

  deploy:
    if: github.repository == 'Bfawaz2001/WaterGeo-UK' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable static beta
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
